app = "tracking-links"
primary_region = "iad"

[build]
  builder = "heroku/buildpacks:20"

[env]
  NODE_ENV = "production"
  SESSION_SECRET = "replace-with-random-string"
  DB_PATH = "/data/tracking.db"

[mounts]
  source = "data"
  destination = "/data"

[http_service]
  internal_port = 3001
  force_https = true